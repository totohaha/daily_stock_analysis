name: Daily US Stock Analysis & Sync

on:
  schedule:
    # Runs at 21:30 UTC (5:30 PM EST) Monday-Friday, giving Yahoo Finance time to update EOD data
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches the environment from your logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Stock Analysis
        env:
          # Maps your GitHub Secrets/Variables directly into the runner environment
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'gemini/gemini-3.8-flash' }}
          STOCK_LIST: ${{ vars.STOCK_LIST }}
          MARKET_REVIEW_REGION: us
        run: |
          python main.py

      - name: Commit and Push Reports to Repository
        run: |
          git config --global user.name "totohaha"
          git config --global user.email "wuxianguk@hotmail.com"
          
          # Check if the reports directory exists before trying to add it
          if [ -d "reports" ]; then
            git add -f reports/
            # Only commit if new reports were actually generated
            git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate daily AI stock reports" && git push)
          else
            echo "No reports directory found. Skipping commit."
          fi